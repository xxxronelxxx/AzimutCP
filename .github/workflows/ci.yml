name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: azimut-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: azimut-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Verify standalone build (no node_modules)
        run: |
          tmp="$(mktemp -d)"
          cp -r build package.json "$tmp"/
          cd "$tmp"
          AZIMUT_PORT=3010 AZIMUT_ORIGIN=http://127.0.0.1:3010 node build/index.js &
          pid=$!
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3010/login; then ok=1; break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          [ "$ok" = "1" ]

  rust:
    name: Rust check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azimutcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/azimutcp
      SQLX_OFFLINE: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.8

      - name: Apply migrations
        run: sqlx migrate run --source azimut-panel/migrations

      - name: cargo check
        run: cargo check --workspace
