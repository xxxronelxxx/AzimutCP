name: Install smoke test

on:
  workflow_dispatch:

jobs:
  install:
    name: One-command install on Ubuntu
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Run one-command installer
        run: sudo bash install.sh 127.0.0.1

      - name: Verify services and UI
        run: |
          set -euo pipefail
          echo "--- health ---"
          curl -fsS http://127.0.0.1:2087/health
          echo
          echo "--- readiness ---"
          curl -fsS http://127.0.0.1:2087/health/ready
          echo
          echo "--- UI over nginx ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/)
          echo "HTTP $code"
          [ "$code" = "200" ]

      - name: Verify admin login
        run: |
          set -euo pipefail
          EMAIL=$(sudo grep '^AZIMUT_ADMIN_EMAIL=' /etc/azimutcp/panel.env | cut -d= -f2-)
          PASS=$(sudo grep '^AZIMUT_ADMIN_PASSWORD=' /etc/azimutcp/panel.env | cut -d= -f2-)
          curl -fsS -X POST http://127.0.0.1:2087/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"${EMAIL}\",\"password\":\"${PASS}\"}" \
            -o /tmp/login.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/login.json'))
          assert d.get('access_token'), d
          assert d.get('role') == 'admin', d
          open('/tmp/azimut_token', 'w').write(d['access_token'])
          print('login OK, role =', d['role'])
          PY

      - name: Verify default hosting stack
        run: |
          set -euo pipefail
          for svc in nginx mariadb php8.4-fpm postfix dovecot rspamd azimut-mail; do
            echo "--- $svc ---"
            systemctl is-active "$svc"
          done

          TOKEN=$(cat /tmp/azimut_token)
          AUTH="Authorization: Bearer ${TOKEN}"
          curl -fsS -H "$AUTH" http://127.0.0.1:2087/api/v1/php/versions -o /tmp/versions0.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/versions0.json'))
          assert any(v['version'] == '8.4' and v['installed'] for v in d['versions']), d
          print('PHP 8.4 installed by default')
          PY

      - name: Create a site and an email account
        run: |
          set -euo pipefail
          TOKEN=$(cat /tmp/azimut_token)
          AUTH="Authorization: Bearer ${TOKEN}"
          JSON="Content-Type: application/json"

          echo "--- create site ---"
          curl -fsS -X POST -H "$AUTH" -H "$JSON"             -d '{"domain":"smoke.example.test","php_version":"8.4","web_server":"nginx"}'             http://127.0.0.1:2087/api/v1/sites -o /tmp/site.json
          cat /tmp/site.json

          SITE_ID=$(python3 -c "import json;print(json.load(open('/tmp/site.json'))['id'])")
          for _ in $(seq 1 60); do
            curl -fsS -H "$AUTH" "http://127.0.0.1:2087/api/v1/sites/${SITE_ID}" -o /tmp/site2.json
            status=$(python3 -c "import json;print(json.load(open('/tmp/site2.json'))['status'])")
            [ "$status" = "active" ] && break
            sleep 5
          done
          [ "$status" = "active" ] || {
            echo "site provisioning failed: $status" >&2
            journalctl -u azimut-panel -n 120 --no-pager || true
            exit 1
          }
          test -f /etc/nginx/sites-available/smoke.example.test.conf
          echo "site is active"

          echo "--- create email domain and mailbox ---"
          curl -fsS -X POST -H "$AUTH" -H "$JSON"             -d "{\"site_id\":\"${SITE_ID}\"}"             http://127.0.0.1:2087/api/v1/email/domains -o /tmp/domain.json
          cat /tmp/domain.json

          curl -fsS -X POST -H "$AUTH" -H "$JSON"             -d "{\"site_id\":\"${SITE_ID}\",\"address\":\"info\",\"password\":\"Str0ng!Passw0rd\",\"quota_mb\":256}"             http://127.0.0.1:2087/api/v1/email/accounts -o /tmp/account.json
          cat /tmp/account.json

          ACCOUNT_ID=$(python3 -c "import json;print(json.load(open('/tmp/account.json'))['id'])")
          for _ in $(seq 1 24); do
            curl -fsS -H "$AUTH" "http://127.0.0.1:2087/api/v1/email/accounts/${ACCOUNT_ID}" -o /tmp/account2.json
            status=$(python3 -c "import json;print(json.load(open('/tmp/account2.json'))['status'])")
            [ "$status" = "active" ] && break
            sleep 5
          done
          [ "$status" = "active" ] || {
            echo "mailbox provisioning failed: $status" >&2
            journalctl -u azimut-panel -n 120 --no-pager || true
            journalctl -u azimut-mail -n 80 --no-pager || true
            exit 1
          }
          sudo grep -q 'info@smoke.example.test' /etc/dovecot/users
          test -d /var/mail/vhosts/smoke.example.test/info
          echo "mailbox is active"

      - name: Verify PHP versions API and install 8.3
        run: |
          set -euo pipefail
          TOKEN=$(cat /tmp/azimut_token)
          AUTH="Authorization: Bearer ${TOKEN}"

          echo "--- installed versions ---"
          curl -fsS -H "$AUTH" http://127.0.0.1:2087/api/v1/php/versions | tee /tmp/versions.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/versions.json'))
          installed = [v['version'] for v in d['versions'] if v['installed']]
          assert installed, d
          print('installed PHP versions:', ', '.join(installed))
          PY

          echo "--- queue PHP 8.4 install ---"
          curl -fsS -X POST -H "$AUTH" http://127.0.0.1:2087/api/v1/php/versions/8.3/install

          for _ in $(seq 1 60); do
            curl -fsS -H "$AUTH" http://127.0.0.1:2087/api/v1/php/versions -o /tmp/versions.json
            installed=$(python3 -c "import json;d=json.load(open('/tmp/versions.json'));print(int(any(v['version']=='8.3' and v['installed'] for v in d['versions'])))")
            if [ "$installed" = "1" ]; then
              echo "PHP 8.3 installed"
              exit 0
            fi
            sleep 5
          done

          echo "PHP 8.3 installation timed out (package repository may be unavailable)" >&2
          journalctl -u azimut-panel -n 120 --no-pager || true
          if journalctl -u azimut-panel -n 120 --no-pager | grep -q "Installing PHP version"; then
            echo "Job executed, but the external PHP repository was unavailable — skipping strict check"
            exit 0
          fi
          exit 1

      - name: Verify PHP modules API
        run: |
          set -euo pipefail
          TOKEN=$(cat /tmp/azimut_token)
          AUTH="Authorization: Bearer ${TOKEN}"
          curl -fsS -H "$AUTH" http://127.0.0.1:2087/api/v1/php/versions -o /tmp/versions2.json
          V=$(python3 -c "import json;d=json.load(open('/tmp/versions2.json'));print(next(v['version'] for v in d['versions'] if v['installed']))")
          echo "checking modules for PHP ${V}"
          curl -fsS -H "$AUTH" "http://127.0.0.1:2087/api/v1/php/versions/${V}/modules" -o /tmp/modules.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/modules.json'))
          assert len(d['modules']) >= 10, d
          print('PHP modules API OK:', len(d['modules']), 'modules')
          PY

      - name: Verify software catalog and install jpegoptim
        run: |
          set -euo pipefail
          TOKEN=$(cat /tmp/azimut_token)
          AUTH="Authorization: Bearer ${TOKEN}"

          curl -fsS -H "$AUTH" http://127.0.0.1:2087/api/v1/software -o /tmp/software.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/software.json'))
          ids = {i['id'] for i in data}
          for required in ('php', 'postgresql', 'redis', 'nodejs', 'composer'):
              assert required in ids, (required, ids)
          print('software catalog OK:', len(data), 'items')
          PY

          curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"version":"latest"}' \
            http://127.0.0.1:2087/api/v1/software/jpegoptim/install

          for _ in $(seq 1 36); do
            curl -fsS -H "$AUTH" http://127.0.0.1:2087/api/v1/software -o /tmp/software.json
            installed=$(python3 -c "import json;d=json.load(open('/tmp/software.json'));print(int(any(i['id']=='jpegoptim' and any(v['installed'] for v in i['versions']) for i in d)))")
            if [ "$installed" = "1" ]; then
              echo "jpegoptim installed via catalog"
              exit 0
            fi
            sleep 5
          done

          echo "jpegoptim installation timed out" >&2
          journalctl -u azimut-panel -n 80 --no-pager || true
          exit 1

      - name: Verify Node.js versions via nvm
        run: |
          set -euo pipefail
          TOKEN=$(cat /tmp/azimut_token)
          AUTH="Authorization: Bearer ${TOKEN}"

          curl -fsS -H "$AUTH" http://127.0.0.1:2087/api/v1/software -o /tmp/software.json
          python3 - <<'PY'
          import json
          data = {i['id']: i for i in json.load(open('/tmp/software.json'))}
          node = [v['version'] for v in data['nodejs']['versions']]
          assert '24' in node and '16' in node, node
          assert [v['version'] for v in data['mysql']['versions']] == ['8.4']
          assert '11.8' in [v['version'] for v in data['mariadb']['versions']]
          print('catalog versions OK:', node)
          PY

          echo "--- install Node.js 20 via nvm ---"
          curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"version":"20"}' \
            http://127.0.0.1:2087/api/v1/software/nodejs/install

          for _ in $(seq 1 48); do
            curl -fsS -H "$AUTH" http://127.0.0.1:2087/api/v1/software -o /tmp/software.json
            installed=$(python3 -c "import json;d=json.load(open('/tmp/software.json'));print(int(any(i['id']=='nodejs' and any(v['version']=='20' and v['installed'] for v in i['versions']) for i in d)))")
            if [ "$installed" = "1" ]; then
              echo "Node.js 20 installed via nvm"
              exit 0
            fi
            sleep 5
          done

          echo "Node.js installation timed out" >&2
          journalctl -u azimut-panel -n 80 --no-pager || true
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: |
          journalctl -u azimut-panel -n 120 --no-pager || true
          journalctl -u azimut-ui -n 60 --no-pager || true
          systemctl status azimut-panel --no-pager || true
          systemctl status azimut-ui --no-pager || true
          sudo cat /etc/azimutcp/panel.env 2>/dev/null | sed 's/PASSWORD=.*/PASSWORD=***/' || true
